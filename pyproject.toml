[project]
name = "medcore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Telsar", email = "17538251135@163.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "langgraph>=1.2.19",
    "openai>=2.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.14.2",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
medcore = "medcore:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
