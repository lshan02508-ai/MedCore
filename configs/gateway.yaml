server:
  listen: ":8080"
  max_request_body_bytes: 33554432
  read_header_timeout: 5s
  request_timeout: 10m
  shutdown_timeout: 30s

backend:
  api_key: ""
  readiness_timeout: 2s
  first_token_timeout: 30s
  stream_idle_timeout: 30s
  response_header_timeout: 30s
  idle_conn_timeout: 90s
  max_idle_conns: 100
  max_idle_conns_per_host: 100

worker_health:
  interval: 5s
  timeout: 2s
  unhealthy_threshold: 3
  healthy_threshold: 2

workload_classification:
  allow_client_hint: false
  realtime_max_input_bytes: 4096
  realtime_max_output_tokens: 256
  long_context_min_input_bytes: 12288
  batch_min_output_tokens: 2048

token_budget:
  allow_client_task_hint: false
  bytes_per_token: 3
  message_overhead_tokens: 4
  default_context_window_tokens: 8192
  default_output_tokens: 1024
  workload_output_tokens:
    realtime: 256
    interactive: 1024
    long_context: 1024
    batch: 4096
  model_context_window_tokens:
    all-task: 8192

scheduler:
  queue_capacity: 500
  max_queued_cost: 500000
  max_queue_wait: 5s
  retry_after: 1s
  aging_interval: 30s
  max_bypass: 8
  prefill_weight: 1
  decode_weight: 3
  ewma_alpha: 0.2
  min_service_rate: 100
  max_service_rate: 1000000
  class_slo:
    realtime: 800ms
    interactive: 3s
    long_context: 10s
    batch: ""

model_pools:
  all-task:
    model: all-task
    max_inflight_cost: 50000
    workers:
      - id: all-task-1
        endpoint: http://127.0.0.1:8889
        api_key: ""
        max_concurrency: 2
        max_inflight_cost: 50000
        initial_service_rate: 3000